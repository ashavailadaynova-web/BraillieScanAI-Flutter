name: braillescan_ai
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  camera: ^0.12.0+2
  image: ^4.10.1
  image_cropper: ^8.0.2
  path_provider: ^2.1.6
  tflite_flutter: ^0.10.4
  image_picker: ^1.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/models/braille_model.tflite
    - assets/models/class_names.json
    - assets/models/labels.txt
    - assets/samples/sample_f.png