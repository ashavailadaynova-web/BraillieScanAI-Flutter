name: braille_scan_ai
description: "BrailleScan AI - Aplikasi pemindai dokumen Braille dengan kamera & AI (Samsung Solve for Tomorrow 2026)."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  camera: ^0.11.0+2
  image: ^4.2.0
  image_picker: ^1.1.2
  intl: ^0.19.0
  path: ^1.9.0
  path_provider: ^2.1.3
  pdf: ^3.10.8
  permission_handler: ^11.3.1
  printing: ^5.13.1
  sensors_plus: ^6.1.1
  sqflite: ^2.3.3+1
  tflite_flutter: ^0.12.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/models/braille_model.tflite
    - test_assets/